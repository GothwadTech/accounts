<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — Gothwad Accounts</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="page">
    <header id="topbar" class="topbar"></header>

    <main class="main">
      <div class="auth-wrap">
        <div class="card auth-card">
          <a class="brand" href="index.html">
            <span class="flame">🔥</span>
            <span>GOTHWAD<span class="brand-sub">Accounts</span></span>
          </a>

          <!-- ====== STEP 1: Request reset link (username maangte hain) ====== -->
          <section id="step-request">
            <h1 class="auth-heading">Forgot password?</h1>
            <p class="auth-subheading">
              Apna username daalo — reset link aapki <b>recovery email</b> par bhej diya jaayega.
            </p>

            <div id="alert-request" class="alert alert-error hidden"></div>
            <div id="done-request" class="alert alert-success hidden"></div>

            <form id="request-form" novalidate>
              <div class="field">
                <label class="label" for="username">Gothwad username</label>
                <div class="input-group">
                  <input class="input mono" id="username" type="text" placeholder="yourname"
                         autocomplete="username" required autofocus />
                  <span class="suffix" id="domain-suffix"></span>
                </div>
              </div>
              <button type="submit" class="btn btn-primary btn-block" id="request-btn">Send reset link</button>
            </form>
          </section>

          <!-- ====== STEP 2: Set new password (email link se aane par) ====== -->
          <section id="step-reset" class="hidden">
            <h1 class="auth-heading">Set a new password</h1>
            <p class="auth-subheading">Aapka reset link verified hai. Naya password choose karo.</p>

            <div id="alert-reset" class="alert alert-error hidden"></div>

            <form id="reset-form" novalidate>
              <div class="field">
                <label class="label" for="password">New password</label>
                <div class="input-wrap">
                  <input class="input" id="password" type="password" placeholder="Min. 8 characters"
                         autocomplete="new-password" required autofocus />
                  <button type="button" class="input-eye" id="toggle-password" aria-label="Show password">👁️</button>
                </div>
              </div>
              <div class="field">
                <label class="label" for="confirm_password">Confirm new password</label>
                <input class="input" id="confirm_password" type="password" placeholder="Repeat password"
                       autocomplete="new-password" required />
              </div>
              <button type="submit" class="btn btn-primary btn-block" id="reset-btn">Update password</button>
            </form>
          </section>

          <p class="auth-footer">
            Remembered it? <a href="login.html">Back to sign in</a>
          </p>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="container footer-inner">
        <div>© 2026 Gothwad Tech</div>
        <div class="footer-links"><a href="index.html">Home</a></div>
      </div>
    </footer>
  </div>

  <script type="module" src="/js/reset.js"></script>
</body>
</html>
