<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Gothwad Accounts</title>
  <meta name="description" content="Sign in to your Gothwad Account — one login for Mail, Drive, Chat, Notes and more." />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="page">
    <header id="topbar" class="topbar"></header>

    <main class="main">
      <div class="auth-wrap">
        <div class="card auth-card">

          <!-- Brand: real Gothwad logo -->
          <div class="brand brand-center">
            <img class="brand-logo" src="/icon-192.png" alt="Gothwad" />
            <span class="brand-name">Gothwad</span>
          </div>

          <!-- ═══════════════ MODE 1: SIGN IN ═══════════════ -->
          <section id="mode-signin">
            <h1 class="auth-heading">Sign in</h1>
            <p class="auth-subheading">Use your Gothwad Account to continue</p>

            <div id="alert-signin" class="alert alert-error hidden"></div>

            <form id="signin-form" novalidate>
              <div class="field">
                <label class="label" for="identifier">Username or email</label>
                <div class="input-group">
                  <input class="input mono" id="identifier" type="text" placeholder="yourname"
                         autocomplete="username" required autofocus />
                  <span class="suffix" id="domain-suffix"></span>
                </div>
              </div>

              <div class="field">
                <label class="label" for="password">Password</label>
                <div class="input-wrap">
                  <input class="input" id="password" type="password" placeholder="Your password"
                         autocomplete="current-password" required />
                  <button type="button" class="input-eye" data-eye="password" aria-label="Show password">👁️</button>
                </div>
              </div>

              <div class="form-row-between" style="margin:4px 0 20px;">
                <label class="checkbox">
                  <input type="checkbox" id="remember" checked />
                  <span>Remember me</span>
                </label>
                <button type="button" id="link-forgot" class="link-btn">Forgot password?</button>
              </div>

              <button type="submit" class="btn btn-primary btn-block" id="signin-btn">Sign in</button>
            </form>

            <p class="auth-footer">
              New to Gothwad? <a href="/signup">Create an account</a>
            </p>
          </section>

          <!-- ═══════════════ MODE 2: FORGOT PASSWORD ═══════════════ -->
          <section id="mode-forgot" class="hidden">
            <h1 class="auth-heading">Forgot password?</h1>
            <p class="auth-subheading">
              Apna username daalo — reset link aapki <b>recovery email</b> par jaayega.
            </p>

            <div id="alert-forgot" class="alert alert-error hidden"></div>
            <div id="done-forgot" class="alert alert-success hidden"></div>

            <form id="forgot-form" novalidate>
              <div class="field">
                <label class="label" for="forgot-username">Gothwad username</label>
                <div class="input-group">
                  <input class="input mono" id="forgot-username" type="text" placeholder="yourname"
                         autocomplete="username" required autofocus />
                  <span class="suffix suffix-copy"></span>
                </div>
              </div>
              <button type="submit" class="btn btn-primary btn-block" id="forgot-btn">Send reset link</button>
            </form>

            <p class="auth-footer">
              <button type="button" class="link-btn" data-goto="signin">← Back to sign in</button>
            </p>
          </section>

          <!-- ═══════════════ MODE 3: SET NEW PASSWORD (email link se) ═══════════════ -->
          <section id="mode-reset" class="hidden">
            <h1 class="auth-heading">Set a new password</h1>
            <p class="auth-subheading">Aapka reset link verified hai. Naya password choose karo.</p>

            <div id="alert-reset" class="alert alert-error hidden"></div>

            <form id="reset-form" novalidate>
              <div class="field">
                <label class="label" for="new-password">New password</label>
                <div class="input-wrap">
                  <input class="input" id="new-password" type="password" placeholder="Min. 8 characters"
                         autocomplete="new-password" required autofocus />
                  <button type="button" class="input-eye" data-eye="new-password" aria-label="Show password">👁️</button>
                </div>
              </div>
              <div class="field">
                <label class="label" for="confirm-password">Confirm new password</label>
                <input class="input" id="confirm-password" type="password" placeholder="Repeat password"
                       autocomplete="new-password" required />
              </div>
              <button type="submit" class="btn btn-primary btn-block" id="reset-btn">Update password</button>
            </form>
          </section>

        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="container footer-inner">
        <div class="flex items-center gap-2">
          <img src="/icon-192.png" alt="" style="width:16px;height:16px;border-radius:4px;" />
          <span>© 2026 Gothwad Tech</span>
        </div>
        <div class="footer-links">
          <a href="/signup">Create account</a>
        </div>
      </div>
    </footer>
  </div>

  <script type="module" src="/js/signin.js"></script>
</body>
</html>
