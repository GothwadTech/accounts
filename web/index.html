<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Gothwad Accounts</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main class="root-splash" aria-live="polite">
    <a class="root-splash-brand" href="/signin" aria-label="Open Gothwad Accounts sign in">
      <img class="root-splash-logo" src="/icon-192.png" alt="" />
      <span class="sr-only">Opening Gothwad Accounts</span>
    </a>
  </main>

  <script type="module">
    import { getSession } from '/js/common.js';

    // Root only gives visitors a short branded hand-off. A temporary API issue
    // must never leave them on a loading page, so it falls back to /signin.
    const session = await Promise.race([
      getSession().catch(() => ({ authenticated: false })),
      new Promise((resolve) => setTimeout(() => resolve({ authenticated: false }), 1200)),
    ]);

    window.location.replace(session.authenticated ? '/me' : '/signin');
  </script>
</body>
</html>
