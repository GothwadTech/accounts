# =============================================================================
# GOTHWAD ACCOUNTS — 100% CLOUDFLARE NATIVE WORKER CONFIG
# =============================================================================
# Zero Supabase. Powered by Cloudflare Workers + Cloudflare D1 + Optional R2.
#
# Deploy:  npx wrangler deploy
# Check:   npx wrangler deploy --dry-run
# Local:   npx wrangler dev        (http://127.0.0.1:8787 — automatic local D1!)
# =============================================================================

# ⚠️ Worker name MUST match Cloudflare Dashboard -> Workers & Pages -> "accounts"
name = "accounts"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Do not delete dashboard-only variables on deploy (Secrets survive deploys automatically)
keep_vars = true
preview_urls = true

# Empty preview block so Cloudflare Workers Builds succeeds cleanly on PR branches
# without exposing production D1 or secrets to non-production previews.
previews = {}

# -----------------------------------------------------------------------------
# 1. CLOUDFLARE D1 DATABASE BINDING (REQUIRED)
# -----------------------------------------------------------------------------
# Bound to Cloudflare D1 SQL Database: "accounts"
[[d1_databases]]
binding = "DB"
database_name = "accounts"
database_id = "392aacf8-1b43-490a-9519-ced4daf5a40f"

# -----------------------------------------------------------------------------
# 2. OPTIONAL: CLOUDFLARE R2 BUCKET FOR PROFILE AVATARS
# -----------------------------------------------------------------------------
# Default (commented out): Avatars store directly inside D1 `user_avatars` +
# Cloudflare Global Edge Cache (`0` credit card required!).
# Future optional upgrade: Create R2 bucket `gothwad-avatars` & uncomment below:
# [[r2_buckets]]
# binding = "AVATARS_BUCKET"
# bucket_name = "gothwad-avatars"

# -----------------------------------------------------------------------------
# 3. PUBLIC CONFIGURATION VARIABLES (No secrets here!)
# -----------------------------------------------------------------------------
[vars]
# Rule #1: Domain sirf yahan set hota hai — code ya DB mein kahin hardcode nahi!
# User email automatically banta hai: username + "@" + APP_DOMAIN
APP_DOMAIN = "gothwadtech.com"

# Frontend public URL (OAuth consent redirect + password reset link + avatars)
AUTH_HUB_URL = "https://accounts.gothwadtech.com"

# Server-to-server Worker Custom Domain (Mail Worker & Kiwi Store Worker calls)
API_DOMAIN = "api.gothwadtech.com"

# Outbound password recovery email sender (Resend free tier: 3,000/month)
RESEND_FROM = "Gothwad Accounts <onboarding@resend.dev>"

# ⚠️ MUST stay "false" in production! ("true" only in local `.dev.vars`)
DEV_MODE = "false"

# Optional extra CORS origins (comma-separated, e.g. preview domains)
# ALLOWED_ORIGINS = ""

# -----------------------------------------------------------------------------
# 4. WORKER SECRETS (Set via Dashboard -> Variables & Secrets -> Type: Secret)
# -----------------------------------------------------------------------------
# Sirf 2 secrets zaroori hain (Supabase keys ab HATA diye gaye hain!):
#
#   1. JWT_SECRET          (REQUIRED) -> 40+ char random secret (signs sessions & OAuth JWTs)
#   2. MAIL_INTERNAL_TOKEN (REQUIRED for Mail) -> Same value as Mail Worker's ACCOUNTS_INTERNAL_TOKEN
#   3. RESEND_API_KEY      (OPTIONAL) -> Resend API key for password recovery emails
#
# CLI alternative:
#   npx wrangler secret put JWT_SECRET
#   npx wrangler secret put MAIL_INTERNAL_TOKEN
#   npx wrangler secret put RESEND_API_KEY
# -----------------------------------------------------------------------------
