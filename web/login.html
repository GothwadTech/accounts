<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Gothwad Accounts</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="page">
    <header id="topbar" class="topbar"></header>

    <main class="main">
      <div class="auth-wrap">
        <div class="card auth-card">
          <a class="brand" href="index.html">
            <span class="flame">🔥</span>
            <span>GOTHWAD<span class="brand-sub">Accounts</span></span>
          </a>

          <h1 class="auth-heading">Sign in</h1>
          <p class="auth-subheading">Use your Gothwad username or email</p>

          <!-- Error box (JS se fill hota hai) -->
          <div id="alert" class="alert alert-error hidden"></div>

          <form id="login-form" novalidate>
            <div class="field">
              <label class="label" for="identifier">Username or email</label>
              <div class="input-group">
                <input class="input mono" id="identifier" name="identifier" type="text"
                       placeholder="yourname" autocomplete="username" required autofocus />
                <span class="suffix" id="domain-suffix"></span>
              </div>
              <div class="hint">Tip: sirf username likho — <span class="mono">@domain</span> apne aap lag jaayega</div>
            </div>

            <div class="field">
              <label class="label" for="password">Password</label>
              <div class="input-wrap">
                <input class="input" id="password" name="password" type="password"
                       placeholder="Your password" autocomplete="current-password" required />
                <button type="button" class="input-eye" id="toggle-password" aria-label="Show password">👁️</button>
              </div>
            </div>

            <div class="form-row-between" style="margin:4px 0 20px;">
              <label class="checkbox">
                <input type="checkbox" id="remember" checked />
                <span>Remember me for 30 days</span>
              </label>
              <a href="reset-password.html" class="text-sm">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Sign in</button>
          </form>

          <p class="auth-footer">
            New to Gothwad? <a href="signup.html">Create an account</a>
          </p>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="container footer-inner">
        <div>© 2026 Gothwad Tech</div>
        <div class="footer-links"><a href="index.html">Home</a></div>
      </div>
    </footer>
  </div>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
