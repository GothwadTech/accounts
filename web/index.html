<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gothwad Accounts</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <style>
    body { background: #0d1117; color: #8b98a9; font-family: system-ui, sans-serif;
           display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  </style>
</head>
<body>
  <div>Redirecting to Gothwad Accounts…</div>
  <script type="module">
    // Root koi page nahi hai — sirf smart redirect:
    // logged-in → /me, warna → /signin  (site ke sirf 3 routes hain)
    import { getSession } from '/js/common.js';
    const session = await getSession();
    location.replace(session.authenticated ? '/me' : '/signin');
  </script>
  <noscript><meta http-equiv="refresh" content="0;url=/signin" /></noscript>
</body>
</html>
